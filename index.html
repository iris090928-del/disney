<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏰 도쿄 디즈니씨 마법 지도 탐험</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Jua&display=swap" rel="stylesheet">
    <!-- Firebase 실시간 라이브러리 추가 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: #001220 url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat fixed;
            color: #fff; 
            font-family: 'Jua', sans-serif; 
            padding: 20px 10px; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .map-card { 
            background: rgba(10, 25, 47, 0.85);
            backdrop-filter: blur(12px);
            border: 4px solid #f4d06f;
            border-radius: 30px; 
            padding: 24px 18px; 
            max-width: 500px; 
            width: 100%;
            box-shadow: 0 0 35px rgba(0, 180, 216, 0.6), inset 0 0 15px rgba(244, 208, 111, 0.3);
            position: relative;
        }

        .logo-area {
            text-align: center;
            border-bottom: 2px solid rgba(244, 208, 111, 0.4);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .disney-sub {
            font-family: 'Cinzel', serif;
            letter-spacing: 4px;
            font-size: 0.8rem;
            color: #4cc9f0;
        }
        .disney-title {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: #fff;
            text-shadow: 0 0 12px #4cc9f0, 0 0 20px #f4d06f;
        }
        .d-day-badge {
            background: rgba(244, 208, 111, 0.2);
            border: 1px solid #f4d06f;
            color: #f4d06f;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            display: inline-block;
            margin-top: 5px;
        }

        .map-board {
            position: relative;
            height: 480px;
            background: url('https://images.unsplash.com/photo-1545569341-9eb8b30979d9?auto=format&fit=crop&w=600&q=80') center/cover;
            border-radius: 20px;
            border: 2px solid #f4d06f;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            margin-bottom: 15px;
        }
        .map-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 20, 35, 0.6);
        }

        .path-line {
            position: absolute;
            left: 50%;
            bottom: 30px;
            top: 60px;
            width: 10px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px dashed #f4d06f;
            transform: translateX(-50%);
            border-radius: 5px;
        }

        .goal-spot {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 2;
        }
        .goal-icon {
            font-size: 3.2rem;
            filter: drop-shadow(0 0 10px #f4d06f);
            animation: float 2s infinite ease-in-out alternate;
        }
        @keyframes float {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        .port-badge {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(13, 27, 42, 0.9);
            border: 1px solid #4cc9f0;
            border-radius: 12px;
            padding: 4px 10px;
            font-size: 0.75rem;
            color: #fff;
            box-shadow: 0 0 8px rgba(76, 201, 240, 0.4);
            white-space: nowrap;
            z-index: 2;
        }

        .hero-character {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.8rem;
            z-index: 3;
            transition: bottom 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 0 12px #f4d06f);
        }

        .control-panel {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(244, 208, 111, 0.3);
        }
        .timer {
            font-size: 2.8rem;
            color: #f4d06f;
            margin: 2px 0;
            font-family: 'Cinzel', 'Jua', serif;
            text-shadow: 0 0 10px rgba(244, 208, 111, 0.5);
        }
        .btn-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }
        
        button {
            border: none;
            padding: 10px 16px;
            font-size: 0.95rem;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Jua';
            transition: 0.2s;
        }
        button:active { transform: scale(0.95); }
        .btn-play { background: #06d6a0; color: #0d1b2a; font-weight: bold; }
        .btn-save { background: #4cc9f0; color: #0d1b2a; font-weight: bold; }
        .btn-quick {
            background: linear-gradient(135deg, #f4d06f, #ffb703);
            color: #0d1b2a;
            width: 100%;
            margin-top: 6px;
            padding: 8px;
            font-weight: bold;
        }
        .sync-status {
            font-size: 0.7rem;
            color: #06d6a0;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="map-card">
    <div class="logo-area">
        <div class="disney-sub">TOKYO</div>
        <div class="disney-title">DisneySEA ®</div>
        <div class="d-day-badge" id="dDayText">🗓️ D-Day 계산 중...</div>
        <h3 id="kmText" style="color:#f4d06f; margin-top:8px;">0 / 3,000 km (0%)</h3>
        <p style="font-size:0.75rem; color:#a0aec0; margin-top:2px;">⏱️ 언니의 훈수 규칙: 공부 1시간 = 30km 전진!</p>
    </div>

    <div class="map-board">
        <div class="map-overlay"></div>
        <div class="path-line"></div>

        <div class="goal-spot">
            <div class="goal-icon">🏰</div>
            <span style="font-size:0.75rem; background:#f4d06f; color:#0d1b2a; padding:2px 8px; border-radius:10px; font-weight:bold;">판타지 스프링스</span>
        </div>

        <div class="port-badge" style="bottom: 360px; border-color:#ff70a6;">🧜‍♀️ 머메이드 라군 (2,250km)</div>
        <div class="port-badge" style="bottom: 240px; border-color:#f4d06f;">🕌 아라비안 코스트 (1,500km)</div>
        <div class="port-badge" style="bottom: 120px; border-color:#06d6a0;">🌋 메디테러니언 하버 (750km)</div>

        <div class="hero-character" id="hero">⛵</div>
    </div>

    <div class="control-panel">
        <div class="timer" id="clock">00:00:00</div>
        
        <div class="btn-row">
            <button class="btn-play" onclick="start()">▶️ 공부 시작</button>
            <button class="btn-save" onclick="stop()">⏹️ 기록 및 전진</button>
        </div>

        <button class="btn-quick" onclick="add(60)">🎨 미술 학원 3시간 (+60km)</button>
        <button class="btn-quick" style="background: linear-gradient(135deg, #ff70a6, #ff85a1); color:#fff;" onclick="add(25)">📝 미술 숙제 완료 (+25km)</button>
        <div class="sync-status" id="syncStatus">🔄 클라우드 연결 중...</div>
    </div>
</div>

<script>
    // 🌐 실시간 데이터베이스 설정 (Firebase)
    const firebaseConfig = {
        databaseURL: "https://disney-map-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('user_disney_km');

    const now = new Date();
    const endOfYear = new Date(now.getFullYear(), 11, 31);
    const diffDays = Math.ceil((endOfYear - now) / (1000 * 60 * 60 * 24));
    document.getElementById('dDayText').innerText = `✨ 올해 꿈의 왕국 도착까지 D-${diffDays}일`;

    const TARGET_KM = 3000;
    let km = 0;
    let sec = 0, timer = null;

    // 📡 실시간 연동 듣기 (서버에 값이 바뀔 때마다 아이패드/핸드폰 동시 업데이트)
    db.on('value', (snapshot) => {
        const val = snapshot.val();
        km = val !== null ? parseFloat(val) : 0;
        updateUI();
        document.getElementById('syncStatus').innerText = "🟢 실시간 멀티 연동 완료!";
    });

    function updateUI() {
        let percent = Math.min(100, (km / TARGET_KM) * 100);
        document.getElementById('kmText').innerText = `${Math.floor(km)} / ${TARGET_KM} km (${percent.toFixed(1)}%)`;
        
        let bottomPx = 30 + (percent * 3.6); 
        document.getElementById('hero').style.bottom = bottomPx + "px";

        if(percent >= 100) document.getElementById('hero').innerText = "👑🏰";
        else if(percent >= 75) document.getElementById('hero').innerText = "🧜‍♀️";
        else if(percent >= 50) document.getElementById('hero').innerText = "🧞‍♂️";
        else if(percent >= 25) document.getElementById('hero').innerText = "🚢";
        else document.getElementById('hero').innerText = "⛵";
    }

    function saveKm(newKm) {
        km = newKm;
        db.set(km); // 클라우드 DB로 전송
    }

    function start() {
        if(!timer) {
            timer = setInterval(() => { 
                sec++; 
                let hrs = String(Math.floor(sec / 3600)).padStart(2, '0');
                let mins = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
                let secs = String(sec % 60).padStart(2, '0');
                document.getElementById('clock').innerText = `${hrs}:${mins}:${secs}`; 
            }, 1000);
        }
    }

    function stop() {
        if(!timer && sec === 0) return;
        clearInterval(timer); timer = null;
        let earned = Math.max(1, Math.round((sec / 3600) * 30));
        saveKm(km + earned);
        sec = 0;
        document.getElementById('clock').innerText = "00:00:00";
        alert(`🎉 ${earned}km 전진! 모든 기기에 실시간으로 기록되었습니다!`);
    }

    function add(amount) { 
        saveKm(km + amount);
        alert(`✨ ${amount}km 전진 완료!`); 
    }
</script>
</body>
</html>
